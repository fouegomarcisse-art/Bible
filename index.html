:root{--pc:#2e7d5b;--ffam:"Source Sans 3",-apple-system,system-ui,sans-serif;--bg:#fbf0dc;--fg:#262c3b;--mut:#7d7566;--acc:#2e7d5b;--card:#fff9ee;--line:#e8dcc2;--sel:#d9e6f5;--ref:#1f8a4c;--navy:#2e3f56;--tabbg:#eff0f2;--tabfg:#9a9ea3;--fs:19px;--h1:#ffe27a;--h2:#b9f0b0;--h3:#b6dcff;--h4:#ffc2dc}
html[data-theme=light]{--bg:#fff;--card:#f7f7f9;--line:#e3e3e8;--sel:#dbe8fb}
html[data-theme=black]{--bg:#000;--fg:#e8e8e8;--mut:#9aa0ab;--card:#121315;--line:#2a2c30;--sel:#1b2c44;--ref:#5aa2f0;--navy:#1a1d22;--tabbg:#0b0b0c;--h1:#7a6a1e;--h2:#2e6a2b;--h3:#235684;--h4:#7a2d52}
html[data-theme=dark]{--bg:#16181d;--fg:#e4e6eb;--mut:#9aa0ab;--card:#20242b;--line:#323843;--sel:#2a3a55;--ref:#5fd08a;--navy:#2a3342;--tabbg:#1d2026;--h1:#7a6a1e;--h2:#2e6a2b;--h3:#235684;--h4:#7a2d52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
#bar{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--pc);color:#fff;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0;display:flex;align-items:center;gap:2px}
#bar button{background:none;border:0;color:#fff;width:44px;height:48px;padding:11px;cursor:pointer}
#bar svg{width:100%;height:100%}
#cbv{display:none;background:#00000040;border-radius:12px;padding:3px;gap:0}#bar #cbv button{width:44px;height:36px;padding:0;border-radius:9px;font-size:17px;font-weight:600;color:#ffffffcc}#bar #cbv button.on{background:#fff;color:var(--acc)}
#ttl{flex:1;text-align:center;font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
main{padding:calc(68px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:auto;min-height:100vh}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--tabbg);border-top:1px solid var(--line);display:flex;padding:4px 2px calc(env(safe-area-inset-bottom) + 2px)}
#tabs button{flex:1;border:0;background:none;color:var(--tabfg);display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0;font-size:11.5px;cursor:pointer;min-width:0}
#tabs button svg{width:34px;height:34px}
#tabs button.on{color:var(--acc)}
.arr{position:fixed;top:50%;z-index:6;width:30px;height:62px;margin-top:-31px;background:#8888881f;color:#6a8fd8;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;user-select:none}
#al{left:0;border-radius:0 31px 31px 0}#ar{right:0;border-radius:31px 0 0 31px}
button,.btn{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button.p,.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.tg.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:9px 0}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search],textarea,select.f{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.item{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
h3.ch{text-align:center;font-size:1.05em;margin:.2em 0 .8em;color:var(--mut);letter-spacing:.03em}
/* Verse */
.vp{font-size:var(--fs);line-height:var(--lh,1.55);padding:5px 4px;margin:2px 0;border-radius:4px}
.vp.sel{background:var(--sel)}
.sech{text-align:center;font-weight:700;font-size:1.08em;margin:1.3em 0 .5em;color:var(--fg)}
a.cs{display:inline-block;min-width:1.35em;height:1.35em;line-height:1.35em;text-align:center;border-radius:50%;background:var(--acc);color:#fff;font:700 .72em/1.35em sans-serif;margin-right:5px;vertical-align:.12em;cursor:pointer}a.cs.on{outline:2px solid var(--acc);outline-offset:1px;background:#fff;color:var(--acc)}
a.vr{color:var(--ref);text-decoration:underline;font-size:.92em;margin-right:3px}
.mk{font-size:.8em;color:var(--acc)}
.tx.h1{background:var(--h1)}.tx.h2{background:var(--h2)}.tx.h3{background:var(--h3)}.tx.h4{background:var(--h4)}
.tx[class*=" h"]{color:var(--fg);border-radius:3px}
.ml{margin:2px 0}.tl{font:700 11px -apple-system,sans-serif;color:var(--acc);text-transform:uppercase;margin-right:3px}
.vp.cols .mlg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.vp.cols .ml{padding-left:8px;border-left:2px solid var(--line)}
.navb{display:flex;gap:10px;margin:18px 0 8px}.navb button{flex:1;padding:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:6px 12px;border-radius:16px}

/* ================= Bibelbücher ================= */

Revelation|Offenbarung|22|Rev,Offb`.split("\n").map(l=>{const[en,de,n,al]=l.split("|");return{en,de,n:+n,al:(al||"").split(",").filter(Boolean)}});
const norm=s=>s.toLowerCase().replace(/[_\u00a0]+/g," ").replace(/\s+/g," ").trim();
BKS.forEach(b=>{b.al=[...b.al,b.de];b.de=b.en});
const ALIAS=[];BKS.forEach((b,i)=>{[b.en,b.de,...b.al].forEach(a=>ALIAS.push([norm(a),i]))});
const NIVA="Ge,Ex,Lev,Nu,Dt,Jos,Jdg,Ru,1Sa,2Sa,1Ki,2Ki,1Ch,2Ch,Ezr,Ne,Est,Job,Ps,Pr,Ecc,SS,Isa,Jer,La,Eze,Da,Hos,Joel,Am,Ob,Jnh,Mic,Na,Hab,Zep,Hag,Zec,Mal,Mt,Mk,Lk,Jn,Ac,Ro,1Co,2Co,Gal,Eph,Php,Col,1Th,2Th,1Ti,2Ti,Tit,Phm,Heb,Jas,1Pe,2Pe,1Jn,2Jn,3Jn,Jude,Rev".split(",");NIVA.forEach((n,i)=>{ALIAS.push([norm(n),i])});
const FRN="Genèse,Exode,Lévitique,Nombres,Deutéronome,Josué,Juges,Ruth,1 Samuel,2 Samuel,1 Rois,2 Rois,1 Chroniques,2 Chroniques,Esdras,Néhémie,Esther,Job,Psaumes,Proverbes,Ecclésiaste,Cantique des Cantiques,Ésaïe,Jérémie,Lamentations,Ézéchiel,Daniel,Osée,Joël,Amos,Abdias,Jonas,Michée,Nahum,Habacuc,Sophonie,Aggée,Zacharie,Malachie,Matthieu,Marc,Luc,Jean,Actes,Romains,1 Corinthiens,2 Corinthiens,Galates,Éphésiens,Philippiens,Colossiens,1 Thessaloniciens,2 Thessaloniciens,1 Timothée,2 Timothée,Tite,Philémon,Hébreux,Jacques,1 Pierre,2 Pierre,1 Jean,2 Jean,3 Jean,Jude,Apocalypse".split(",");FRN.forEach((n,i)=>{ALIAS.push([norm(n),i]);const f=norm(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"");if(f!==norm(n))ALIAS.push([f,i])});

 for(const[a,i]of ALIAS){if(s===a)return i;if(!exact&&s.startsWith(a)&&!/[a-zäöüß]/.test(s[a.length]||" "))return i}return -1}
const XRE=(()=>{const alts=[...new Set(ALIAS.map(a=>a[0]).filter(a=>a.length>2||/\d/.test(a)))].map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/ /g,"\\s"));
 return new RegExp("(?<![A-Za-z0-9])("+alts.join("|")+")\\.?\\s+(\\d{1,3}):(\\d{1,3})(?![0-9])","gi")})();

/* ================= Speicher ================= */
let db=null;const mem={mods:[],ents:[],notes:[]};
const R=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("bibelstudium2",1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("mods",{keyPath:"id"});
  const e=d.createObjectStore("ents",{keyPath:"id"});e.createIndex("bc",["mod","book","chap"]);e.createIndex("mod","mod");
  d.createObjectStore("notes",{keyPath:"id"})};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})}

 for(let i=0;i<arr.length;i+=150){await new Promise((ok,no)=>{const t=db.transaction("ents","readwrite"),s=t.objectStore("ents");arr.slice(i,i+150).forEach(x=>s.put(x));t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error||new Error("Speicher voll?"))})}}
async function entsBC(mod,b,c){return db?R(st("ents").index("bc").getAll(IDBKeyRange.only([mod,b,c]))):mem.ents.filter(e=>e.mod===mod&&e.book===b&&e.chap===c)}
async function eachEnt(mod,fn){if(!db){for(const e of mem.ents)if(e.mod===mod&&fn(e)===false)return;return}
 await new Promise((ok,no)=>{const q=st("ents").index("mod").openCursor(IDBKeyRange.only(mod));q.onsuccess=()=>{const c=q.result;if(!c)return ok();if(fn(c.value)===false)return ok();c.continue()};q.onerror=()=>no(q.error)})}
async function delMod(id){await delOne("mods",id);if(!db){mem.ents=mem.ents.filter(e=>e.mod!==id);return}
 await new Promise(ok=>{const q=st("ents","readwrite").index("mod").openCursor(IDBKeyRange.only(id));q.onsuccess=()=>{const c=q.result;if(!c)return ok();c.delete();c.continue()};q.onerror=()=>ok()})}

/* ================= ZIP ohne Bibliothek ================= */
async function unzip(buf){
 const dv=new DataView(buf),u8=new Uint8Array(buf);let e=u8.length-22;
 while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error("Not a valid EPUB file");
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
 for(let i=0;i<n;i++){const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  files[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={method,csize,off};p+=46+nl+el+cl}
 return{get:async name=>{const f=files[name];if(!f)return null;const lo=f.off,s=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u8.subarray(s,s+f.csize);
  if(f.method===0)return data;
  return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer())}}}

async function gsearch(q){S.gq=q;const out=$("#gr"),sq=S.sq;if(q.length<2){out.innerHTML="";return}
 let jump="";const rm=q.match(/^(.+?)\s+(\d+)(?:[:,.](\d+))?$/);
 if(rm){const b=findBook(rm[1],true);if(b>=0&&+rm[2]>=1&&+rm[2]<=BKS[b].n)jump=`<div class="jump" data-j="${b}:${rm[2]}:${rm[3]||1}"><b>Go to ${esc(refName(b,+rm[2],rm[3]?+rm[3]:0))}</b> ›</div>`}
 const sn=/^[GHgh]\d{1,4}$/.test(q)?q.toUpperCase():null;
 if(q.length<3&&!jump&&!sn){out.innerHTML="";return}
 out.innerHTML=jump+'<p class="mut">Searching …</p>';
 const words=fold(q).split(/\s+/).filter(Boolean),hits=[],LIM=300;
 const okB=b=>sq.ts==="all"||(sq.ts==="ot"?b<39:b>=39);
 const test=x=>words.every(w=>x.includes(w));
 for(const m of MODS.filter(m=>(m.type==="bible"&&sq.sc!=="comm")||(m.type==="comm"&&sq.sc!=="bible"))){await eachEnt(m.id,e=>{
  if(!okB(e.book))return true;
  if(e.kind==="b"){for(const[v,tx0]of e.verses){let ok;
    if(sn&&m.strongs)ok=tx0.includes("["+sn+"]");else ok=test(fold(tx0.replace(tag,"")));
    if(ok)hits.push({m,b:e.book,c:e.chap,v,tx:tx0.replace(tag,""),tab:"bible"})}}
  else if(e.kind==="c"){const pl=plain(e.html);if(test(fold(pl)))hits.push({m,b:e.book,c:e.chap,v:e.v1||1,tx:pl,tab:"comm"})}
  return hits.length<LIM})}
 const hi=(tx)=>{const f=fold(tx);let k=-1,len=0;for(const w of words){const i=f.indexOf(w);if(i>=0&&(k<0||i<k)){k=i;len=w.length}}if(k<0)k=0;const s0=Math.max(0,k-50);
  let seg=tx.slice(s0,k+130),fs=fold(seg);const mark=[];for(const w of words){let i=0;while((i=fs.indexOf(w,i))>=0){mark.push([i,i+w.length]);i+=w.length}}
  mark.sort((a,b)=>a[0]-b[0]);let o="",p=0;for(const[a,b]of mark){if(a<p)continue;o+=esc(seg.slice(p,a))+"<mark>"+esc(seg.slice(a,b))+"</mark>";p=b}return(s0>0?"…":"")+o+esc(seg.slice(p))+"…"};
 const head=`<p class="mut">${hits.length>=LIM?LIM+"+":hits.length} results${sn?" for "+sn:""}</p>`;
 out.innerHTML=jump+(hits.length?head+hits.map((h,i)=>`<div class="item" data-i="${i}"><b>${esc(refName(h.b,h.c,h.v))}</b> <span class="mut">${esc(h.m.short||h.m.title.slice(0,18))}</span><div class="mut">${sn&&h.tab==="bible"?esc(h.tx.slice(0,160)):hi(h.tx)}</div></div>`).join(""):(jump?"":'<p class="mut">No results.</p>'));
 out.querySelectorAll("[data-j]").forEach(el=>el.onclick=()=>{const[b,c,v]=el.dataset.j.split(":").map(Number);S.autoScroll=true;goRef(b,c,v,"bible")});
 out.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{const h=hits[el.dataset.i];if(h.tab==="comm"){S.cm=h.m.id;S.cs={[h.m.id]:true}}S.autoScroll=true;goRef(h.b,h.c,h.v,h.tab)})}

const TTS="speechSynthesis" in window,AU={q:[],i:0,on:false,paused:false,tok:0,pending:false,cont:false};
const gl=t=>{const w=" "+t.toLowerCase().replace(/[^a-zàâçéèêëîïôûùüäöß]+/g," ")+" ";const sc=a=>a.reduce((n,x)=>n+(w.split(" "+x+" ").length-1),0);
 const f=sc("le la les des et que qui dans est pas pour vous nous il ne un une au du de sur avec son ses je tu".split(" ")),d=sc("der die das und nicht ist ein den mit von sie er zu auf für dem im ich wir es auch eine sich".split(" ")),e=sc("the and of to that is for with he his they unto thou thee shall was it be not".split(" "));

const LC={fr:"fr-FR",de:"de-DE",en:"en-US"};
const voiceFor=l=>{if(!TTS)return null;const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(l));const pn=(S.vo||{})[l];return vs.find(v=>v.name===pn)||vs.find(v=>v.localService)||vs[0]};
function chunks(t,N){N=N||230;t=t.replace(/\s+/g," ").trim();const out=[];while(t.length>N){let k=Math.max(t.lastIndexOf(". ",N),t.lastIndexOf("; ",N),t.lastIndexOf(", ",N),t.lastIndexOf(" ",N));if(k<60)k=N;out.push(t.slice(0,k+1));t=t.slice(k+1).trim()}if(t)out.push(t);return out}
const clean=el=>{const c=el.cloneNode(true);c.querySelectorAll("a.sn,.mk,a.vr,.tl,button,script,style").forEach(x=>x.remove());return c.textContent.replace(/\s+/g," ").trim()};
function collect(){const items=[],add=(el,t)=>{t=(t||"").replace(/\s+/g," ").trim();if(t)items.push({el,t})};
 if(S.tab==="bible"){const h=main.querySelector("h3.ch");if(h)add(h,h.textContent);main.querySelectorAll(".vp").forEach(v=>{const x=v.querySelector(".tx");add(v,x?clean(x):"")})}
 else if(S.tab==="comm"){let ds=[...main.querySelectorAll("details[open]")];if(!ds.length)ds=[...main.querySelectorAll("details")];ds.forEach(d=>add(d,clean(d)))}
 else if(S.tab==="dict"){let ds=[...main.querySelectorAll("details[open]")];if(!ds.length)ds=[...main.querySelectorAll("details")].slice(0,3);ds.forEach(d=>add(d,clean(d)))}
 else{const cm=main.querySelector(".cm");const root=cm||main;const bl=[...root.querySelectorAll(cm?":scope > *":"h3,p,li,.item")];if(cm&&!bl.length)add(cm,clean(cm));const h=cm&&main.querySelector("h3.ch");bl.slice(0,400).forEach(b=>{if(h&&b.tagName[0]==="H"&&clean(b)===h.textContent.trim())return;add(b,clean(b))});if(h)items.unshift({el:h,t:h.textContent})}
 const q=[];items.forEach(it=>chunks(it.t).forEach(c=>q.push({el:it.el,t:c})));return q}
function auMark(el){main.querySelectorAll(".pl").forEach(x=>x.classList.remove("pl"));if(el&&el.isConnected){el.classList.add("pl");const r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-140)el.scrollIntoView({block:"center",behavior:"smooth"})}}

const TR={cache:(()=>{try{return JSON.parse(localStorage.getItem("bs_tr")||"{}")}catch(e){return{}}})(),stop:false,busy:false};
const hsh=x=>{let h=5381;for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return h.toString(36)};
const decEnt=t=>{const a=document.createElement("textarea");a.innerHTML=t;return a.value};
async function trChunk(text,src,tgt){const k=hsh(src+tgt+text);if(TR.cache[k])return TR.cache[k];
 const r=await fetch((window.TRURL||"https://api.mymemory.translated.net/get")+"?q="+encodeURIComponent(text)+"&langpair="+src+"|"+tgt);
 if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
 if(j.responseStatus&&+j.responseStatus!==200)throw new Error(j.responseDetails||("Error "+j.responseStatus));
 const t=decEnt(j.responseData.translatedText||"");if(/MYMEMORY WARNING|QUERY LENGTH/i.test(t))throw new Error(t.slice(0,80));
 TR.cache[k]=t;try{localStorage.setItem("bs_tr",JSON.stringify(TR.cache))}catch(e){TR.cache={}}return t}
async function trText(text,tgt){const src=gl(text);if(src===tgt)return null;const out=[];for(const c of chunks(text,420))out.push(await trChunk(c,src,tgt));return out.join(" ")}
function trBlocks(){const els=[];main.querySelectorAll(".cm,.dk").forEach(box=>{if(box.offsetParent===null)return;const ch=[...box.children].filter(c=>/^(P|BLOCKQUOTE|LI|H4|DIV|UL|OL)$/.test(c.tagName));if(ch.length)ch.forEach(c=>els.push(c));else els.push(box)});
 let budget=1800;return els.filter(e=>{if(e.textContent.trim().length<3||e.classList.contains("trl")||e.dataset.tr)return false;const r=e.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight*2)return false;if(budget<=0)return false;budget-=e.textContent.length;return true})}
async function trRun(tgt){if(TR.busy){TR.stop=true;return}
 const had=main.querySelectorAll(".trl");if(had.length&&main.dataset.trt===tgt&&!trBlocks().length){had.forEach(x=>x.remove());main.querySelectorAll("[data-tr]").forEach(x=>delete x.dataset.tr);delete main.dataset.trt;return}
 const els=trBlocks();if(!els.length)return;TR.busy=true;TR.stop=false;main.dataset.trt=tgt;const b=$(tgt==="fr"?"#tr1":"#tr2"),lab=b.textContent;
 try{let i=0;for(const el of els){if(TR.stop)break;i++;b.textContent=`⏹ ${i}/${els.length}`;
   if(!el.isConnected)break;const t=await trText(el.textContent.replace(/\s+/g," ").trim(),tgt);el.dataset.tr=1;
   if(t){const d=document.createElement("div");d.className="trl";d.textContent=t;el.after(d)}}}
 catch(e){const d=document.createElement("div");d.className="trl";d.style.color="#c0392b";d.textContent="Translation not possible: "+e.message+" (internet needed; the free service has a daily limit). Alternatively select the text and choose Translate in the iOS menu (also works offline).";main.prepend(d)}
 TR.busy=false;b.textContent=lab}

 msg(c.title+": speichere …");await tick();
 const id="m"+Date.now()+Math.random().toString(36).slice(2,5),mod={id,title:c.title,short:c.short,type:c.type,added:Date.now(),count:0,src:c.file};
 if(c.type==="other"){mod.chapters=j.c.map(([title,html])=>({title,html}));mod.count=mod.chapters.length;await putOne("mods",mod);return mod}

 if(c.type==="heads"){for(const[book,chap,v,title]of j.h){E({kind:"h",book,chap,v1:v,ec:chap,ev:v,title,html:""})}await bulkEnts(ents);mod.count+=ents.length;await putOne("mods",mod);return mod}
 if(c.type==="comm"){for(const[book,chap,v1,ec,ev,title,html]of j.e){E({kind:"c",book,chap,v1,ec,ev,title,html});if(ents.length>=400){await bulkEnts(ents);mod.count+=ents.length;ents=[];await tick()}}await bulkEnts(ents);mod.count+=ents.length;await putOne("mods",mod);return mod}
 if(c.type==="bible"){mod.strongs=!!j.s;
  for(let b=0;b<66;b++)(j.b[b]||[]).forEach((vs,ci)=>{const verses=[];vs.forEach((t,k)=>{if(t)verses.push([k+1,t])});if(verses.length)E({kind:"b",book:b,chap:ci+1,verses})})}
 else if(j.r){for(const[num,key,html]of j.r){const pure=/^[GH]\d+$/.test(num);

 await bulkEnts(ents);mod.count=n;await putOne("mods",mod);return mod}
